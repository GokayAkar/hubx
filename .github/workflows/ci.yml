name: CI

# Pull requests only. The ruleset requires a branch to be up to date with
# `main` before it can merge, so the pull request's run already tests exactly
# the content that will land — and nothing can reach `main` except through a
# pull request. A second run after the merge would re-test the same tree under
# a new commit hash and report nothing new.
#
# `workflow_dispatch` stays, for the days you want to hear it from `main`
# itself rather than from the branch that was about to become it.
on:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer worthless, so
# it is cancelled rather than left to finish and report on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "stable": a moving toolchain turns an unrelated release into a
  # red build on a branch nobody touched. Raising this is its own commit, with
  # its own green run behind it.
  FLUTTER_VERSION: "3.41.2"

jobs:
  verify:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Cheapest checks first: a run that is going to fail should say so in
      # thirty seconds rather than after the test suite.
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Layer boundaries
        run: dart run tool/check_layer_deps.dart

      # Generated code is committed so a clone builds without a codegen pass.
      # That trade only holds while the committed output matches its sources,
      # and nothing about editing a route or an .arb forces you to regenerate
      # — so the build checks, instead of trusting.
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          if ! git diff --quiet -- lib; then
            echo "::error::Committed generated code is stale. Run 'dart run build_runner build && flutter gen-l10n' and commit the result."
            git diff --stat -- lib
            exit 1
          fi

      - name: Tests
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGP 8.11 and Kotlin 2.2 both target 17; the runner's default JDK is
      # not guaranteed to be.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      # Downloadable from the run's summary page, so a reviewer can install the
      # branch on a phone without a toolchain of their own.
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The runner's default Xcode moves when GitHub updates the image, which
      # is how an iOS build starts failing on a commit that touched no iOS
      # code. Stated explicitly rather than inherited.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned: signing needs a certificate this repository has no business
      # holding. It still compiles the Dart, the plugins and the Xcode project,
      # which is what catches an iOS-only break.
      - name: Build (unsigned)
        run: flutter build ios --debug --no-codesign
