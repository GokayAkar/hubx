name: hubx
description: "HubX Flutter application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  auto_route: ^11.1.0
  bloc: ^9.2.1
  dio: ^5.11.0
  dio_smart_retry: ^7.0.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1
  intl: any
  json_annotation: ^4.12.0
  meta: ^1.17.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^3.0.0

dev_dependencies:
  auto_route_generator: ^10.5.0
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  # Enables gen-l10n during `flutter pub get` / build
  generate: true

  # One folder per feature. Flutter does not recurse, so each has its own line.
  assets:
    - assets/images/home/
    - assets/images/onboarding/
    - assets/images/paywall/

  # Bundled rather than downloaded at runtime: the app must look the same on
  # iOS, where Roboto is not a system font, and on first launch offline.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800

# Turns asset paths into constants: a wrong file name stops compiling instead
# of throwing at runtime.
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: false
